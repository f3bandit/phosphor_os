# Checks for the TV's shell (frontend/), docs/menu-rules.md: the menu must never wait for phosphord on something it
# asks again and again (check_polls.py), and draws opaque, with no timer or animation outliving its screen
# (check_drawing.py).
name: Shell checks
on:
  push:
    paths: ["frontend/**", "tools/check-polls/**", ".github/workflows/shell-checks.yml"]
  pull_request:
    paths: ["frontend/**", "tools/check-polls/**", ".github/workflows/shell-checks.yml"]
  workflow_dispatch:
jobs:
  polls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No new synchronous polls on the menu's repeating paths
        run: python3 tools/check-polls/check_polls.py
      - name: Drawing and lifetime rules (opaque drawing, deferred callbacks)
        run: python3 tools/check-polls/check_drawing.py
