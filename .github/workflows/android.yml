# Phosphor for Android: tests (screenshots of every screen) and APKs.
# Debug APK always; the release APK is signed only when the signing secrets are set
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD).
# ScreenScraper dev login: PHOSPHOR_SS_DEVID, PHOSPHOR_SS_DEVPASSWORD (scrambled into the APK).
name: Android app
on:
  push:
    paths: ["apps/android/**", ".github/workflows/android.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        env:
          # Phosphor's ScreenScraper developer login (repo secrets; empty on forks and PRs, so scraping is off there)
          PHOSPHOR_SS_DEVID: ${{ secrets.PHOSPHOR_SS_DEVID }}
          PHOSPHOR_SS_DEVPASSWORD: ${{ secrets.PHOSPHOR_SS_DEVPASSWORD }}
        run: ./gradlew --console=plain testDebugUnitTest assembleDebug assembleRelease
      - name: Sign the release APK
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: ${{ env.KS != '' }}
        run: |
          echo "$KS" | tr -d '[:space:]' | base64 -d > /tmp/release.jks
          # pasted secrets can carry stray spaces or newlines
          KEY_ALIAS=$(printf '%s' "$KEY_ALIAS" | tr -d '[:space:]')
          KS_PASS=$(printf '%s' "$KS_PASS" | tr -d '\r\n'); KEY_PASS=$(printf '%s' "$KEY_PASS" | tr -d '\r\n'); export KS_PASS KEY_PASS
          keytool -list -keystore /tmp/release.jks -storepass:env KS_PASS | grep -i entry || true
          [ "$KS_PASS" = "$KEY_PASS" ] && echo "key password: same as keystore" || echo "key password: differs (length ${#KEY_PASS})"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f 4 app/build/outputs/apk/release/app-release-unsigned.apk /tmp/aligned.apk
          "$BT/apksigner" sign --ks /tmp/release.jks --ks-pass env:KS_PASS --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASS \
            --out app/build/outputs/apk/release/phosphor-release.apk /tmp/aligned.apk
          rm -f /tmp/release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: phosphor-android
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/app/build/outputs/apk/release/*.apk
            apps/android/app/build/screenshots/*.png
