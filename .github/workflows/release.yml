# Publishes a Phosphor release when its files are pushed to release-assets/<tag> (e.g.
# release-assets/0.27.42-beta). That branch is the commit to release plus one commit adding release/:
#   release/notes.md                  the release notes
#   release/phosphor-<v>-armhf.tar.gz built with install/build-release.sh (phosphord from "Secret builds")
#   release/Phosphor_win_<v>.zip      Phosphor.exe from "Secret builds", THIRD_PARTY_NOTICES.md, LICENSE.md
# This checks the package was built from that commit, builds the SD card image from it, writes
# SHA256SUMS.txt, tags the commit and publishes the release, then removes the branch. Published as
# f3bandit when the RELEASE_TOKEN secret is set (a fine-grained token for this repo, Contents: read and
# write); otherwise as github-actions.
name: Release
on:
  push:
    branches: ["release-assets/**"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: The staged files
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#release-assets/}"
          V="${TAG%-beta}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "V=$V" >> "$GITHUB_ENV"
          # the release is the commit under the one that adds release/
          [ "$(git diff --name-only HEAD^ HEAD | grep -cv '^release/')" = 0 ] || { echo "::error::the last commit must only add release/"; exit 1; }
          target="$(git rev-parse HEAD^)"; echo "TARGET=$target" >> "$GITHUB_ENV"
          tarball="release/phosphor-$V-armhf.tar.gz"
          [ -f release/notes.md ] || { echo "::error::no release/notes.md"; exit 1; }
          [ -f "$tarball" ] || { echo "::error::no $tarball"; exit 1; }
          ls release/Phosphor_win_*.zip > /dev/null || { echo "::error::no release/Phosphor_win_*.zip"; exit 1; }
          gh release view "$TAG" > /dev/null 2>&1 && { echo "::error::$TAG is already released"; exit 1; }
          # the package must be this version, built from that commit, and complete
          got="$(tar -xzOf "$tarball" "phosphor-$V/VERSION")"
          case "$got" in "$V ("*")") ;; *) echo "::error::the package is $got, not $V"; exit 1 ;; esac
          built="${got#"$V ("}"; built="${built%)}"
          case "$target" in "$built"*) ;; *) echo "::error::the package was built from $built, the release is ${target:0:7}"; exit 1 ;; esac
          mkdir -p dist
          tar -xzf "$tarball" -C dist
          (cd "dist/phosphor-$V" && sha256sum -c --quiet SHA256SUMS)
          rm -rf "dist/phosphor-$V"
          cp "$tarball" release/Phosphor_win_*.zip dist/
          ls -l dist
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -y -q p7zip-full mtools dosfstools zip
      - name: SD card image
        run: image/build-image.sh dist/phosphor-*-armhf.tar.gz
      - name: Publish
        run: |
          set -e
          cd dist
          files="$(ls phosphor-$V-sdcard-*.img.zip) phosphor-$V-armhf.tar.gz $(ls Phosphor_win_*.zip)"
          sha256sum $files > SHA256SUMS.txt
          cat SHA256SUMS.txt
          title="Phosphor $V"; case "$TAG" in *-beta) title="$title (beta)" ;; esac
          gh release create "$TAG" --target "$TARGET" --title "$title" --notes-file ../release/notes.md $files SHA256SUMS.txt
      - name: Remove the staging branch
        if: success()
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$GITHUB_REF_NAME" || echo "::warning::couldn't remove $GITHUB_REF_NAME"
