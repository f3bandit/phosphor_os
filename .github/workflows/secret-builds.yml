# The builds that carry Phosphor's ScreenScraper developer login (repo secrets PHOSPHOR_SS_DEVID,
# PHOSPHOR_SS_DEVPASSWORD): phosphord for the MiSTer and Phosphor.exe. The login is scrambled into each
# (tools/secrets/ss_scramble.py) and never written to the repo or the log. install/build-release.sh takes
# these in place of local builds (PHOS_SECRET_BUILDS=<the downloaded artifact>), so a release scrapes with
# Phosphor's own developer ID. Forks and pull requests get no secrets: those builds use the person's own ID.
name: Secret builds
on:
  push:
    branches: ["main", "next-*"]
    paths: ["system/**", "apps/windows/**", "tools/secrets/**", ".gitleaks.toml", ".github/workflows/secret-builds.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # (the scan reads every commit of a push; a merge brings many)
      - name: Secret scan (nothing secret in the repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: ARM cross compiler
        run: sudo apt-get update -q && sudo apt-get install -y -q gcc-arm-linux-gnueabihf
      - name: musl for the MiSTer (cached)
        id: musl
        uses: actions/cache@v4
        with:
          path: /opt/musl-armhf
          key: musl-armhf-1.2.5-${{ hashFiles('tools/musl/build-toolchain.sh') }}
      - if: steps.musl.outputs.cache-hit != 'true'
        run: sudo tools/musl/build-toolchain.sh /opt/musl-armhf
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/windows/go.mod
      - name: Build phosphord (ARM) and Phosphor.exe
        env:
          PHOSPHOR_SS_DEVID: ${{ secrets.PHOSPHOR_SS_DEVID }}
          PHOSPHOR_SS_DEVPASSWORD: ${{ secrets.PHOSPHOR_SS_DEVPASSWORD }}
        run: |
          set -e
          if [ -z "$PHOSPHOR_SS_DEVID" ] || [ -z "$PHOSPHOR_SS_DEVPASSWORD" ]; then
            echo "::warning::No ScreenScraper developer login (secrets missing): builds use the person's own ID"
            unset PHOSPHOR_SS_DEVID PHOSPHOR_SS_DEVPASSWORD
          fi
          cmake -S system -B system/build-arm -DCMAKE_TOOLCHAIN_FILE="$PWD/frontend/cmake/armhf.cmake" > /dev/null
          cmake --build system/build-arm -j"$(nproc)" --target phosphord
          (cd apps/windows && sh build-exe.sh)
          mkdir -p out && cp system/build-arm/phosphord apps/windows/dist/Phosphor.exe out/
          # the login must not be readable in either program
          if [ -n "$PHOSPHOR_SS_DEVPASSWORD" ]; then
            for f in out/*; do
              if strings "$f" | grep -qF -- "$PHOSPHOR_SS_DEVPASSWORD"; then echo "::error::$f has the login in plain text"; exit 1; fi
            done
          fi
          rm -f system/build-arm/ss_secret.h
          file out/*
      - uses: actions/upload-artifact@v4
        with:
          name: secret-builds
          path: out/
          retention-days: 14
