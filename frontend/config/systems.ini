; Phosphor: systems and how each one is started.
; Copy to /media/fat/phosphor/config/systems.ini to change a built-in system or add one.
; Only the keys you set are changed.
;
;   name        shown in the library
;   category    Disc, Cartridge, Handheld, Arcade or Computer
;   folders     games folder names, | separated (looked for in games/ on USB drives, the share, the SD card)
;   rbf         core, relative to /media/fat, without date or .rbf; | separated alternatives
;   extensions  | separated
;   type        f = file (cartridges), s = storage (discs)    } which entry in the core's
;   index       slot number in the core's file menu          } file menu the game goes into
;   delay       seconds to wait after the core loads
;
; The built-in type/index/delay values still need checking on hardware, core by core.
; If a game opens the core but doesn't start, the index is the usual culprit.

[PSX]
type = s
index = 1
delay = 1

; Example of an extra system:
; [Vectrex]
; name = Vectrex
; category = Cartridge
; folders = VECTREX
; rbf = _Console/Vectrex
; extensions = vec|bin
; type = f
; index = 1
; delay = 1
